                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;การสมัครผ่านการแนะนำจาก &lt;strong&gt;Hello Work Narita&lt;/strong&gt; ทำให้กระบวนการง่ายขึ้นมาก เราให้ค่าประสบการณ์และความน่าเชื่อถือของคุณ!&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;ứng tuyển qua giới thiệu từ &lt;strong&gt;Hello Work Narita&lt;/strong&gt; sẽ giúp quy trình suôn sẻ hơn. Chúng tôi trân trọng kinh nghiệm và sự đáng tin cậy của bạn!&lt;/span&gt;

    &lt;section class=&quot;benefits-section&quot;&gt;
        &lt;div class=&quot;container&quot;&gt;

                &lt;h2&gt;

                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;අප හා සේවය කිරීමේ වාසි&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ทำไมต้องทำงานกับเรา?&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Tại Sao Nên Làm Việc Với Chúng Tôi?&lt;/span&gt;
                &lt;/h2&gt;
                &lt;p&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Comprehensive benefits and a supportive work environment&lt;/span&gt;
                    &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;充実した福利厚生とサポートのある職場環境&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Komprehensibong benepisyo at suportadong lugar ng trabaho&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;व्यापक लाभ र सहायक कार्य वातावरण&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;සම්පූර්ණ වාසිදායක සහ සහායක වැඩ පරිසරයක්&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;สวัสดิการครบครันและสภาพแวดล้อมการทำงานที่เอื้ออาทร&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Phúc lợi toàn diện và môi trường làm việc hỗ trợ&lt;/span&gt;
                &lt;/p&gt;
            &lt;/div&gt;

            &lt;div style=&quot;text-align: center; margin-bottom: 40px;&quot;&gt;&lt;img src=&quot;https://ts3.mm.bing.net/th?id=OIP.DRI3iNryMuz8rHiVIl-yKAHaHW&amp;pid=15.1&amp;o=7&amp;rm=3&quot; alt=&quot;清掃用品&quot; class=&quot;section-image&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;benefits-grid&quot;&gt;
                &lt;div class=&quot;benefit-card fade-in&quot;&gt;
                    &lt;div class=&quot;benefit-icon&quot;&gt;&lt;i class=&quot;fas fa-shield-alt&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                    &lt;h3&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Social Insurance&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;社会保険&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Social Insurance&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;सामाजिक बीमा&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;සමාජ රක්ෂණය&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ประกันสังคม&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Bảo Hiểm Xã Hội&lt;/span&gt;
                    &lt;/h3&gt;
                    &lt;p&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Available for those working 3+ days/week and 20+ hours/week. Full social security coverage depending on working conditions.&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;週3日以上・週20時間以上で加入可能。勤務条件に応じて社会保険完備。&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Available para sa mga nagtatrabaho ng 3+ araw/linggo at 20+ oras/linggo. Buong social security coverage.&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;हप्तामा ३+ दिन र २०+ घण्टा काम गर्नेहरूको लागि उपलब्ध। कामको अवस्था अनुसार पूर्ण सामाजिक सुरक्षा कभरेज।&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;සතියකට දින 3කට වැඩි සහ පැය 20කට වැඩි කාලයක් වැඩ කරන අයට ලබා ගත හැක. වැඩ කොන්දේසි අනුව සම්පූර්ණ සමාජ ආරක්ෂණ ආවරණය.&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;สำหรับผู้ทำงาน 3 วัน/สัปดาห์ขึ้นไป และ 20 ชั่วโมง/สัปดาห์ขึ้นไป ประกันสังคมครบตามเงื่อนไขการทำงาน&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Dành cho người làm 3+ ngày/tuần và 20+ giờ/tuần. Bảo hiểm xã hội đầy đủ tùy điều kiện làm việc.&lt;/span&gt;
                    &lt;/p&gt;
                &lt;/div&gt;

                &lt;div class=&quot;benefit-card fade-in&quot;&gt;
                    &lt;div class=&quot;benefit-icon&quot;&gt;&lt;i class=&quot;fas fa-bus&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                    &lt;h3&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Transport Allowance&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;交通費支給&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Allowance sa Transport&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;यातायात भत्ता&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;ප්‍රවාහන දීමනාව&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ค่าเดินทาง&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Trợ Cấp Đi Lại&lt;/span&gt;
                    &lt;/h3&gt;
                    &lt;p&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Provided for ALL employees. We cover your commute expenses to make work accessible.&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;全従業員に支給。通勤費を負担し、働きやすい環境を整えます。&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Ibinibigay para sa LAHAT ng empleyado. Sinasagot namin ang inyong pamasahe para mas madaling makapagtrabaho.&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;सबै कर्मचारीहरूको लागि प्रदान गरिएको। हामी तपाईंको यात्रा खर्च बेहोर्छौं।&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;සියලුම සේවකයින්ට ලබා දෙයි. වැඩට යාමේ ප්‍රවාහන වියදම් අපි දරමු.&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ให้กับพนักงานทุกคน เราออกค่าเดินทางให้เพื่อให้การทำงานสะดวกขึ้น&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Cung cấp cho TẤT CẢ nhân viên. Chúng tôi chi trả chi phí đi lại để bạn dễ dàng đi làm.&lt;/span&gt;
                    &lt;/p&gt;
                &lt;/div&gt;

                &lt;div class=&quot;benefit-card fade-in&quot;&gt;
                    &lt;div class=&quot;benefit-icon&quot;&gt;&lt;i class=&quot;fas fa-calendar-alt&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                    &lt;h3&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Flexible Schedule&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;柔軟な勤務体系&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Flexible na Iskedyul&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;लचिलो समय तालिका&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;නම්‍යශීලී කාලසටහන&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ตารางเวลายืดหยุ่น&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Lịch Trình Linh Hoạt&lt;/span&gt;
                    &lt;/h3&gt;
                    &lt;p&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Minimum 2 days/week (10+ hrs). Work year-end, New Year, or summer only - your choice!&lt;/span&gt;

                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Min 2 araw/linggo (10+ oras). Pwede ring year-end, New Year, o summer lang - ikaw ang bahala!&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;न्यूनतम २ दिन/हप्ता (१०+ घण्टा)। वर्षअन्त, नयाँ वर्ष, वा गर्मी मात्र - तपाईंको रोजाइ!&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;අවම දින 2ක්/සතිය (පැය 10+). අවසාන වසර, අලුත් අවුරුද්ද, හෝ ගිම්හානය පමණි - ඔබේ තේරීම!&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;ขั้นต่ำ 2 วัน/สัปดาห์ (10+ ชม.) ทำช่วงสิ้นปี ปีใหม่ หรือฤดูร้อนอย่างเดียวก็ได้ - ตามใจคุณ!&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Tối thiểu 2 ngày/tuần (10+ giờ). Làm cuối năm, Tết, hoặc chỉ mùa hè - tùy bạn chọn!&lt;/span&gt;
                    &lt;/p&gt;
                &lt;/div&gt;

                &lt;div class=&quot;benefit-card fade-in&quot;&gt;
                    &lt;div class=&quot;benefit-icon&quot;&gt;&lt;i class=&quot;fas fa-globe&quot;&gt;&lt;/i&gt;&lt;/div&gt;
                    &lt;h3&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;Foreigner Friendly&lt;/span&gt;
                        &lt;span class=&quot;lang-content active&quot; data-lang=&quot;jp&quot;&gt;外国人歓迎&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Foreigner Friendly&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;np&quot;&gt;विदेशी मैत्रीपूर्ण&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;විදේශික මිතුරුකමි&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;th&quot;&gt;เป็นมิตรกับชาวต่างชาติ&lt;/span&gt;
                        &lt;span class=&quot;lang-content&quot; data-lang=&quot;vn&quot;&gt;Thân Thiện Với Người Nước Ngoài&lt;/span&gt;
                    &lt;/h3&gt;

    &lt;section id=&quot;faq&quot;&gt;
        &lt;div class=&quot;faq-inner&quot;&gt;
            &lt;h2 class=&quot;faq-heading&quot;&gt;成田市ホテル清掃｜時給・勤務時間のよくある質問&lt;br&gt;&lt;span style=&quot;font-weight:500;&quot;&gt;Pay &amp;amp; Working Hours FAQ&lt;/span&gt;&lt;/h2&gt;
            &lt;div class=&quot;faq-list&quot;&gt;
                &lt;article class=&quot;faq-item&quot;&gt;
                    &lt;h3&gt;時給はいくらですか？ / What is the hourly pay?&lt;/h3&gt;
                    &lt;p&gt;時給1,195円～1,300円です。交通費は全従業員に全額支給します。 Hourly wage is 1,195–1,300 yen, and transportation allowance is paid to all staff.&lt;/p&gt;
                &lt;/article&gt;
                &lt;article class=&quot;faq-item&quot;&gt;
                    &lt;h3&gt;どのくらい長く働けますか？ / How many hours can I work?&lt;/h3&gt;
                    &lt;p&gt;週2日（週10時間以上）から勤務できます。勤務日・勤務時間・雇用形態は相談可能で、ルームマイスターは10:00-17:00、客室清掃スタッフは9:00-16:00が目安です。週3日以上・週20時間以上働くと社会保険に加入できます。 Work from 2 days (10+ hours) a week; more days and longer hours can be discussed. Social insurance applies from 3+ days and 20+ hours per week.&lt;/p&gt;
                &lt;/article&gt;
                &lt;article class=&quot;faq-item&quot;&gt;
                    &lt;h3&gt;未経験・外国人・シニアでも応募できますか？ / Can beginners, foreigners and seniors apply?&lt;/h3&gt;
                    &lt;p&gt;はい。未経験歓迎、60歳以上歓迎、外国人歓迎です（現在のビザで就労可能な場合）。研修制度があります。 Yes. No experience needed, ages 60+ welcome, foreigners welcome (if your visa allows part-time work). Training is provided.&lt;/p&gt;
                &lt;/article&gt;
                &lt;article class=&quot;faq-item&quot;&gt;
                    &lt;h3&gt;勤務地はどこですか？ / Where is the work?&lt;/h3&gt;
                    &lt;p&gt;千葉県成田市のホテルです。 Hotels in Narita City, Chiba.&lt;/p&gt;
                &lt;/article&gt;
            &lt;/div&gt;
        &lt;/div&gt;

    &lt;script&gt;
        function switchLang(lang, btn) {
            // Remove active from all buttons
            document.querySelectorAll(&#x27;.lang-btn&#x27;).forEach(b =&gt; {
                b.classList.remove(&#x27;active&#x27;);
            });
            // Add active to clicked button
            if (btn) btn.classList.add(&#x27;active&#x27;);

            // Hide all lang-content
            document.querySelectorAll(&#x27;.lang-content&#x27;).forEach(content =&gt; {
                content.classList.remove(&#x27;active&#x27;);
            });

            // Show only the selected language content
            document.querySelectorAll(&#x27;[data-lang=&quot;&#x27; + lang + &#x27;&quot;]&#x27;).forEach(el =&gt; {
                el.classList.add(&#x27;active&#x27;);
            });

            document.querySelectorAll(&#x27;.lang-content&#x27;).forEach(content =&gt; {
                content.classList.remove(&#x27;active&#x27;);
            });
            document.querySelectorAll(&#x27;[data-lang=&quot;&#x27; + lang + &#x27;&quot;]&#x27;).forEach(el =&gt; {
                el.classList.add(&#x27;active&#x27;);
            });

            const langMap = {
                &#x27;en&#x27;: &#x27;en&#x27;, &#x27;jp&#x27;: &#x27;ja&#x27;, &#x27;fil&#x27;: &#x27;tl&#x27;, 
                &#x27;np&#x27;: &#x27;ne&#x27;, &#x27;si&#x27;: &#x27;si&#x27;, &#x27;th&#x27;: &#x27;th&#x27;, &#x27;vn&#x27;: &#x27;vi&#x27;
            };
            document.documentElement.lang = langMap[lang] || &#x27;en&#x27;;
        }

        const observerOptions = {
            threshold: 0.1,
            rootMargin: &#x27;0px 0px -50px 0px&#x27;
        };

        const observer = new IntersectionObserver((entries) =&gt; {
            entries.forEach(entry =&gt; {
                if (entry.isIntersecting) {
                    entry.target.classList.add(&#x27;visible&#x27;);
                }
            });
        }, observerOptions);

        document.querySelectorAll(&#x27;.fade-in&#x27;).forEach(el =&gt; {
            observer.observe(el);
        });

        document.getElementById(&#x27;resume&#x27;).addEventListener(&#x27;change&#x27;, function(e) {
            const file = e.target.files[0];
            if (file) {
                const uploadDiv = document.querySelector(&#x27;.file-upload&#x27;);
                uploadDiv.innerHTML = &#x27;&lt;i class=&quot;fas fa-check-circle&quot; style=&quot;color: var(--success); font-size: 2rem;&quot;&gt;&lt;/i&gt;&lt;p style=&quot;color: var(--success); font-weight: 600;&quot;&gt;&#x27; + file.name + &#x27;&lt;/p&gt;&lt;p style=&quot;font-size: 0.8rem; color: #666;&quot;&gt;Click to change file&lt;/p&gt;&#x27;;
                uploadDiv.style.borderColor = &#x27;var(--success)&#x27;;
                uploadDiv.style.background = &#x27;#f0fff4&#x27;;
            }
        });

        document.querySelectorAll(&#x27;a[href^=&quot;#&quot;]&#x27;).forEach(anchor =&gt; {
            anchor.addEventListener(&#x27;click&#x27;, function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute(&#x27;href&#x27;));
                if (target) {
                    target.scrollIntoView({
                        behavior: &#x27;smooth&#x27;,
                        block: &#x27;start&#x27;
                    });
                }
            });
        });

        let lastScroll = 0;
        const langBar = document.querySelector(&#x27;.lang-bar&#x27;);

        window.addEventListener(&#x27;scroll&#x27;, () =&gt; {
            const currentScroll = window.pageYOffset;
            if (currentScroll &gt; lastScroll &amp;&amp; currentScroll &gt; 100) {
                langBar.style.transform = &#x27;translateY(-100%)&#x27;;
            } else {
                langBar.style.transform = &#x27;translateY(0)&#x27;;
            }
            lastScroll = currentScroll;
        });

        function openRulesModal() {
            document.getElementById(&#x27;rulesModal&#x27;).classList.add(&#x27;open&#x27;);
            document.body.style.overflow = &#x27;hidden&#x27;;
        }
        function closeRulesModal() {
            document.getElementById(&#x27;rulesModal&#x27;).classList.remove(&#x27;open&#x27;);
            document.body.style.overflow = &#x27;&#x27;;
        }
        document.addEventListener(&#x27;keydown&#x27;, function(e) {
            if (e.key === &#x27;Escape&#x27;) closeRulesModal();
        });

        // Initialize Japanese as default language on page load
        document.addEventListener(&#x27;DOMContentLoaded&#x27;, function() {
            // Set Japanese as default

                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;en&quot;&gt;If you wish to switch to housekeeping (maid) duties, we can discuss it separately. However, please note that the conditions will NOT be the same as those for regular maid staff.&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;cn&quot;&gt;如希望转为客房清洁（女服务员）工作，可另行商议。但请注意，其条件与正式女服务员员工的条件并不完全相同。&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;fil&quot;&gt;Kung gusto mong lumipat sa housekeeping (maid) na trabaho, maaari nating pag-usapan nang hiwalay. Gayunpaman, ang mga kondisyon ay HINDI katulad ng sa mga regular na maid staff.&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;si&quot;&gt;හවුස්කීපිං / මෙයිඩ් (Room Cleaning) කාර්යයට මාරුවීමට කැමති නම් සාකච්ඡා කළ හැක. නමුත්, එම කොන්දේසි නිත්‍ය මෙයිඩ් සේවකයින්ට අදාඳ සියලුම කොන්දේසි සහ ප්‍රතිලාභ ඒ ආකාරයෙන්ම ලබා දිය නොහැක.&lt;/span&gt;
                    &lt;span class=&quot;lang-content&quot; data-lang=&quot;tw&quot;&gt;如希望轉為客房清潔（女服務員）工作，可另行商議。但請注意，其條件與正式女服務員員工的條件並不完全相同。&lt;/span&gt;
                &lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/section&gt;

        function switchLang(lang, btn) {
            document.querySelectorAll(&#x27;.lang-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
            if (btn) btn.classList.add(&#x27;active&#x27;);
            document.querySelectorAll(&#x27;.lang-content&#x27;).forEach(c =&gt; c.classList.remove(&#x27;active&#x27;));
            document.querySelectorAll(&#x27;[data-lang=&quot;&#x27; + lang + &#x27;&quot;]&#x27;).forEach(el =&gt; el.classList.add(&#x27;active&#x27;));
            const langMap = { &#x27;en&#x27;: &#x27;en&#x27;, &#x27;jp&#x27;: &#x27;ja&#x27;, &#x27;cn&#x27;: &#x27;zh-CN&#x27;, &#x27;fil&#x27;: &#x27;tl&#x27;, &#x27;si&#x27;: &#x27;si&#x27;, &#x27;tw&#x27;: &#x27;zh-TW&#x27; };
            document.documentElement.lang = langMap[lang] || &#x27;en&#x27;;
        }

        const observer = new IntersectionObserver((entries) =&gt; {
            entries.forEach(entry =&gt; { if (entry.isIntersecting) entry.target.classList.add(&#x27;visible&#x27;); });
        }, { threshold: 0.1, rootMargin: &#x27;0px 0px -50px 0px&#x27; });
        document.querySelectorAll(&#x27;.fade-in&#x27;).forEach(el =&gt; observer.observe(el));

        document.querySelectorAll(&#x27;a[href^=&quot;#&quot;]&#x27;).forEach(anchor =&gt; {
            anchor.addEventListener(&#x27;click&#x27;, function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute(&#x27;href&#x27;));
                if (target) target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
            });
        });

        let lastScroll = 0;
        const langBar = document.querySelector(&#x27;.lang-bar&#x27;);
        window.addEventListener(&#x27;scroll&#x27;, () =&gt; {
            const currentScroll = window.pageYOffset;
            if (currentScroll &gt; lastScroll &amp;&amp; currentScroll &gt; 100) langBar.style.transform = &#x27;translateY(-100%)&#x27;;
            else langBar.style.transform = &#x27;translateY(0)&#x27;;
            lastScroll = currentScroll;
        });

        function openRulesModal() {
            document.getElementById(&#x27;rulesModal&#x27;).classList.add(&#x27;open&#x27;);
            document.body.style.overflow = &#x27;hidden&#x27;;
        }
        function closeRulesModal() {
            document.getElementById(&#x27;rulesModal&#x27;).classList.remove(&#x27;open&#x27;);
            document.body.style.overflow = &#x27;&#x27;;
        }
        document.addEventListener(&#x27;keydown&#x27;, function(e) { if (e.key === &#x27;Escape&#x27;) closeRulesModal(); });

        document.addEventListener(&#x27;DOMContentLoaded&#x27;, function() {
            switchLang(&#x27;jp&#x27;, document.querySelector(&#x27;.lang-btn.active&#x27;));
        });
    &lt;/script&gt;
