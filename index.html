<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホテル清掃スタッフ募集</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Yu Gothic", sans-serif;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:60px;
    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url("https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200");
    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:800px;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 30px;
    border-radius:50px;
    background:rgba(255,255,255,0.15);
    border:2px solid #e8b84b;

    color:#ffffff !important;
    font-weight:700;
    font-size:22px;
}

.hero-badge i,
.hero-badge span{
    color:#ffffff !important;
}

.hero-title{
    margin-top:25px;
    color:#ffffff;
    font-size:64px;
    line-height:1.2;
    font-weight:800;
}

.hero-title span{
    background:#ffffff;
    color:#1e3a5f;
    padding:8px 18px;
    border-radius:10px;
}

.hero-desc{
    margin-top:20px;
    color:#ffffff;
    font-size:24px;
}
</style>

</head>
<body>

<section class="hero">

<div class="hero-content">

<div class="hero-badge">
🧹 <span>成田市で募集中！</span>
</div>

<h1 class="hero-title">
成田市のホテル清掃<br>
<span>スタッフ募集</span>
</h1>

<p class="hero-desc">
未経験歓迎｜60歳以上歓迎｜外国人活躍中
</p>

</div>

</section>

</body>
</html>
